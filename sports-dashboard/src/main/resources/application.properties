spring.application.name=sports-dashboard

# PostgreSQL configuration placeholders for local development.
# Replace these values with your local database settings before running the app.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sports_dashboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Football-Data.org configuration placeholders.
# Add your personal API key in the environment or in this file before fetching live data.
football-data.api-key=${FOOTBALL_DATA_API_KEY:}
football-data.base-url=${FOOTBALL_DATA_BASE_URL:https://api.football-data.org/v4}

server.port=8080
